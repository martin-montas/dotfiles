source-file ~/.config/tmux/tmux.reset.conf
# Change this line in ~/.tmux.conf
set-option -g default-terminal "xterm-256color"

# This line is actually good—it enables TrueColor (RGB) support
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy on      # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top    # macOS / darwin style
set-option -g status-style "bg=default,fg=#AA0000"
set-option -g window-status-current-style 'bg=#008080,fg=#AA0000'
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Use vi keys in copy mode
setw -g mode-keys vi

# Unbind the default copy-mode key (optional)
unbind [

# Rebind to use Prefix + v to enter copy-mode
bind v copy-mode

# Copy in vi mode with 'y' → copies to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"


