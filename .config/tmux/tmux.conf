source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy on     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position bottom       # macOS / darwin style
set-option -g status-style "bg=#757575 fg=#AA0000"
set-option -g window-status-current-style 'bg=#000000,fg=#AA0000'
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Use vi keys in copy mode
setw -g mode-keys vi

# Unbind the default copy-mode key (optional)
unbind [

# Rebind to use Prefix + v to enter copy-mode
bind v copy-mode

# Copy in vi mode with 'y' → copies to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"


# ========================================
#
#               bar change
#
# ========================================
set -g status-right-length 200
set -g status-right "\
#[bg=black, fg=#004D4D]< Pub: #(curl -6 -s https://v6.ident.me) \
#[bg=#0000AA, fg=#8A3B00]< #(/home/william/.config/tmux/tmux-net.sh) \
#[bg=black, fg=#3B0A0A]< RAM: #(free -h | awk '/Mem:/ {print $3}') \
#[bg=black, fg=#AA0000]< CPU: #(awk '/^cpu / {u=$2+$4; t=$2+$3+$4+$5+$6+$7+$8+$9; printf \"%.1f\", (u/t)*100}' /proc/stat)% \
#[bg=black, fg=#8A3B00]< %H:%M \
#[bg=black, fg=#004D4D]< %Y-%m-%d"

# vim-like pane switching
bind ^k select-pane -U
bind ^j select-pane -D
bind ^h select-pane -L
bind ^l select-pane -R
bind ^[ last-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'   # bind P is the command for floating terminal
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'

run '~/.tmux/plugins/tpm/tpm'
